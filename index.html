<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Sci-Fi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{min-height:100vh;background:url('mirror-log-bg.png') center/cover no-repeat,#020d1f;display:flex;align-items:center;justify-content:center;position:relative}
body::before{content:'';position:absolute;inset:0;background:rgba(2,13,31,0.85)}
.card{position:relative;z-index:2;width:92%;max-width:380px;background:rgba(10,25,50,0.92);border:1px solid #00eaff44;border-radius:18px;padding:24px}
.logo{text-align:center}
.logo img{width:90px;height:90px;object-fit:contain}
.logo h1{color:#7efcff;letter-spacing:2px;margin-top:8px;font-size:20px}
.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #00eaff33;background:#061428;color:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,#00eaff,#7efcff);color:#001a33;font-weight:700;margin-top:12px}
.tab{display:flex;gap:10px;margin-bottom:12px}
.tab button{flex:1;padding:10px;border-radius:8px;border:1px solid #00eaff33;background:transparent;color:#7efcff}
.tab button.active{background:#00eaff22}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="mirror-log.png" alt="logo">
    <h1>MIRROR SCI-FI</h1>
  </div>
  <div class="tab">
    <button id="loginTab" class="active" onclick="switchTab('login')">Login</button>
    <button id="regTab" onclick="switchTab('register')">Register</button>
  </div>
  <input id="phone" class="input" placeholder="Phone">
  <input id="password" type="password" class="input" placeholder="Password">
  <input id="names" class="input" placeholder="Names" style="display:none">
  <input id="referral" class="input" placeholder="Referral" style="display:none">
  <button class="btn" onclick="handleAuth()">INJIRA</button>
  <div id="msg"></div>
</div>
<script src="config.js"></script>
<script>
let mode='login';
function switchTab(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('regTab').classList.toggle('active',m==='register');document.getElementById('names').style.display=m==='register'?'block':'none';document.getElementById('referral').style.display=m==='register'?'block':'none';}
async function handleAuth(){
 const phone=document.getElementById('phone').value.trim();
 const pass=document.getElementById('password').value.trim();
 const names=document.getElementById('names').value.trim();
 const ref=document.getElementById('referral').value.trim();
 const {data,error}=mode==='login' ? await supabaseClient.from('users').select('*').eq('phone',phone).eq('password',pass).single() : await supabaseClient.from('users').insert({phone,password:pass,names,referral_code:phone.slice(-6),referred_by:ref}).select().single();
 if(error){document.getElementById('msg').innerText=error.message;return}
 localStorage.setItem('mirror_user',JSON.stringify(data));
 if(data.role==='admin'||data.is_admin) location.href='admin.html'; else location.href='dashboard.html';
}
const cached=JSON.parse(localStorage.getItem('mirror_user')||'null');
if(cached){if(cached.role==='admin') location.href='admin.html'; else location.href='dashboard.html';}
</script>
</body>
 </html>
