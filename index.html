<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRROR SCI-FI - Welcome</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;position:relative;overflow-x:hidden}
.mirror-bg{position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920') center/cover;opacity:.10;filter:blur(1px) brightness(1.6);z-index:-2}
.mirror-overlay{position:fixed;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(240,248,255,.92));backdrop-filter:blur(25px);z-index:-1}
.glide{animation:glide 7s ease-in-out infinite;font-family:'Orbitron',monospace}@keyframes glide{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px);text-shadow:0 0 25px rgba(0,200,255,.4)}}
.glass{background:rgba(255,255,255,.85);backdrop-filter:blur(30px);border:1px solid rgba(0,200,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.08)}
input{width:100%;padding:15px 18px;border-radius:14px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.9);outline:none;font-size:14px;transition:.2s}
input:focus{border-color:#00c8ff;box-shadow:0 0 0 4px rgba(0,200,255,.12)}
.btn-mirror{background:linear-gradient(135deg,#0a0a0a,#1a1a2e);color:#fff;padding:15px;border-radius:14px;border:none;width:100%;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s}
.btn-mirror:active{transform:scale(.98)} .btn-mirror:disabled{opacity:.6;cursor:not-allowed}
.tab{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer;transition:.2s;border:1px solid transparent}
.tab-active{background:#0a0a0a;color:#fff} .tab-inactive{background:rgba(0,0,0,.05);color:#666}
</style>
</head>
<body>
<div class="mirror-bg"></div><div class="mirror-overlay"></div>
<div class="glass rounded-[32px] p-7 md:p-8 w-full max-w-[440px] relative mt-10">
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-20 rounded-full overflow-hidden border-4 border-white shadow-2xl bg-white"><img src="https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=300" class="w-full h-full object-cover"></div>
<div class="mt-8 text-center"><h1 class="glide text-[26px] font-bold tracking-widest text-[#0a0a0a]">MIRROR SCI-FI</h1><p class="text-[10px] tracking-[0.3em] text-gray-500 mt-1 font-semibold">WHITE MIRROR • WELCOME 2,000 FRW</p></div>

<div class="flex gap-2 mt-6 p-1.5 bg-black/[0.04] rounded-[14px]">
<button id="tabRegister" class="tab tab-active" onclick="switchTab('register')">IYANDIKISHE</button>
<button id="tabLogin" class="tab tab-inactive" onclick="switchTab('login')">LOGIN</button>
</div>

<!-- REGISTER -->
<form id="registerForm" class="mt-5 space-y-3">
<input id="full_name" placeholder="Amazina yuzuye" required>
<input id="phone" placeholder="Telefone 078..." required>
<input type="password" id="password" placeholder="Password (min 6)" required minlength="6">
<input id="referral_code_input" placeholder="Referral Code (optional)">
<button type="submit" id="btnReg" class="btn-mirror mt-1">IYANDIKISHE → DASHBOARD</button>
<p id="msgReg" class="text-center text-[13px] min-h-[18px] font-semibold"></p>
</form>

<!-- LOGIN -->
<form id="loginForm" class="mt-5 space-y-3 hidden">
<input id="login_phone" placeholder="Telefone yawe" required>
<input type="password" id="login_password" placeholder="Password yawe" required>
<button type="submit" id="btnLogin" class="btn-mirror mt-1">LOGIN → DASHBOARD</button>
<p id="msgLogin" class="text-center text-[13px] min-h-[18px] font-semibold"></p>
</form>

</div>
<script>
const SUPABASE_URL='https://evkzhphiuxkahjejgswlam.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2a3pocGl1eGthZWplZ3N3bGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDg5MzQsImV4cCI6MjEwODA4NDkzNH0.Yu-2Djq7sWY1bjHY-GnpVLpWr70nls7bDF0Bd_FLcSA';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('ref')){document.getElementById('referral_code_input').value=urlParams.get('ref').toUpperCase();}

function switchTab(t){
 document.getElementById('tabRegister').className=t==='register'?'tab tab-active':'tab tab-inactive';
 document.getElementById('tabLogin').className=t==='login'?'tab tab-active':'tab tab-inactive';
 document.getElementById('registerForm').classList.toggle('hidden',t!=='register');
 document.getElementById('loginForm').classList.toggle('hidden',t!=='login');
}

// REGISTER
document.getElementById('registerForm').addEventListener('submit',async(e)=>{
 e.preventDefault();const btn=document.getElementById('btnReg');const msg=document.getElementById('msgReg');
 if(btn.disabled)return;const orig=btn.innerText;btn.innerText='TURIMO...';btn.disabled=true;msg.innerText='';
 try{
  const full_name=document.getElementById('full_name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value.trim();
  const referred_by=document.getElementById('referral_code_input').value.trim().toUpperCase()||null;
  if(full_name.length<3)throw new Error('Amazina - mato');if(phone.length<10)throw new Error('Telefone - siyo');
  const {data:exists}=await supabaseClient.from('members').select('id').eq('phone',phone).maybeSingle();
  if(exists)throw new Error('Phone isanzweho - Kanda LOGIN');
  const myCode='MIRROR'+Math.random().toString(36).substring(2,7).toUpperCase();
  const {data,error}=await supabaseClient.from('members').insert([{full_name,phone,password,referral_code:myCode,referred_by,balance:2000,welcome_bonus:2000}]).select().single();
  if(error)throw error;
  localStorage.setItem('mirror_user_id',data.id);localStorage.setItem('mirror_phone',phone);
  msg.style.color='#00a000';msg.innerText='✓ Welcome 2,000 FRW...';setTimeout(()=>location.href='dashboard.html',800);
 }catch(err){msg.style.color='#e11';msg.innerText=err.message;btn.innerText=orig;btn.disabled=false;}
});

// LOGIN
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
 e.preventDefault();const btn=document.getElementById('btnLogin');const msg=document.getElementById('msgLogin');
 if(btn.disabled)return;const orig=btn.innerText;btn.innerText='TURIMO...';btn.disabled=true;msg.innerText='';
 try{
  const phone=document.getElementById('login_phone').value.trim();
  const password=document.getElementById('login_password').value.trim();
  const {data,error}=await supabaseClient.from('members').select('*').eq('phone',phone).eq('password',password).maybeSingle();
  if(error||!data)throw new Error('Phone cyangwa Password - sibyo');
  localStorage.setItem('mirror_user_id',data.id);localStorage.setItem('mirror_phone',phone);
  msg.style.color='#00a000';msg.innerText='✓ Murakaza neza...';setTimeout(()=>location.href='dashboard.html',600);
 }catch(err){msg.style.color='#e11';msg.innerText=err.message;btn.innerText=orig;btn.disabled=false;}
});
</script>
</body>
 </html>
